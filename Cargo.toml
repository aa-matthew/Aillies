[workspace]
resolver = "2"
members = ["crates/aillies-core", "crates/aillies-codex", "crates/aillies-node", "crates/aillies-cli"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.9.0-alpha.1"
edition = "2021"
rust-version = "1.87"
license = "UNLICENSED"
authors = ["Anyaxis Labs"]
repository = "https://github.com/anyaxis/aillies"

[workspace.dependencies]
aillies-core = { path = "crates/aillies-core" }
aillies-codex = { path = "crates/aillies-codex" }
aillies-node = { path = "crates/aillies-node" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
