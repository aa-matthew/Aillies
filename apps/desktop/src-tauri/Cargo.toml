[package]
name = "aillies-desktop"
description = "Aillies tray app"
version = "1.2.0"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"

[lib]
name = "aillies_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aillies-core = { path = "../../../crates/aillies-core" }
aillies-node = { path = "../../../crates/aillies-node" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls"] }
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
futures-util = "0.3"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
