name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p aillies-cli --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          bin=target/${{ matrix.target }}/release/aillies
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" dist/
          (cd dist && tar czf ../aillies-${{ matrix.target }}.tar.gz *)
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: aillies-${{ matrix.target }}.tar.gz

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo install tauri-cli --version '^2' --locked
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Aillies ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
