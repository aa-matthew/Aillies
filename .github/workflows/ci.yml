name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python3 scripts/release-version-test.py
      - run: python3 scripts/update-release-test.py
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Diagnose Windows loader failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile
          $binary = Get-ChildItem apps/desktop/src-tauri/target/debug/deps/aillies_desktop_lib-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($binary) { python scripts/windows-loader-check.py $binary.FullName }
      - run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml
      - if: runner.os == 'Linux'
        run: for f in apps/desktop/ui/*.js; do node --check "$f"; done
