[package]
name = "aillies-node"
description = "Aillies device node: identity, pairing, pinned peer transport, loopback API"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aillies-core.workspace = true
aillies-codex.workspace = true
aillies-claude.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
uuid.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
directories.workspace = true
tracing.workspace = true
base64.workspace = true
gethostname = "0.5"
if-addrs = "0.13"
subtle = "2"
png = "0.17"
spake2 = "0.4"
aes-gcm = "0.10"
mdns-sd = { version = "0.13.11", default-features = false, features = ["async"] }
iroh = { version = "=0.92.0", default-features = false }

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile.workspace = true
reqwest = { workspace = true, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry"] }
